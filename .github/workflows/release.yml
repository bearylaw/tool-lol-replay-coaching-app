# A version tag (v1.2.3) builds RiftReview.exe in CI and publishes it as a GitHub
# release: the same check as every push first, then the exe, its SHA-256 and the
# tag's CHANGELOG section as notes. The tag must match <Version> in
# Directory.Build.props, the one place the version lives.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: extractions/setup-just@v4

      - name: Tag matches the version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Directory.Build.props -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version>" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install
        run: just install

      - name: Check
        run: just check

      - name: Build
        run: just build

      - name: Checksum and notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/RiftReview.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist/RiftReview.exe.sha256", "$hash  RiftReview.exe`n")
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: )").Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $notes = @(
            $section
            ""
            "## Download"
            ""
            "Download **RiftReview.exe** below and start it; no installer, no .NET needed (Windows 10 or 11, x64, with League of Legends installed)."
            ""
            "The exe is not code-signed, so on first start Windows SmartScreen says *Windows protected your PC*: click **More info**, then **Run anyway**."
            ""
            "SHA-256: ``$hash``"
          ) -join "`n"
          [IO.File]::WriteAllText("release-notes.md", $notes)

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          dist/RiftReview.exe dist/RiftReview.exe.sha256
          --title "Rift Review $env:VERSION"
          --notes-file release-notes.md
          --verify-tag
